name: Deploy

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]

jobs:
  deploy-testnet:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: testnet
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
    
    - name: Install dependencies
      run: |
        forge install
        forge build
    
    - name: Deploy to Sepolia
      run: |
        forge script script/DeployLVR.s.sol --rpc-url ${{ secrets.SEPOLIA_RPC_URL }} --broadcast --verify
      env:
        PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
    
    - name: Deploy AVS to Sepolia
      run: |
        cd avs-new/contracts
        forge script script/DeployMyL1Contracts.s.sol --rpc-url ${{ secrets.SEPOLIA_RPC_URL }} --broadcast --verify
        forge script script/DeployMyL2Contracts.s.sol --rpc-url ${{ secrets.SEPOLIA_RPC_URL }} --broadcast --verify
      env:
        PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}

  deploy-mainnet:
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: mainnet
    steps:
    - uses: actions/checkout@v4
    
    - name: Install Foundry
      uses: foundry-rs/foundry-toolchain@v1
      with:
        version: nightly
    
    - name: Install dependencies
      run: |
        forge install
        forge build
    
    - name: Deploy to Mainnet
      run: |
        forge script script/DeployLVR.s.sol --rpc-url ${{ secrets.ETHEREUM_RPC_URL }} --broadcast --verify
      env:
        PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
    
    - name: Deploy AVS to Mainnet
      run: |
        cd avs-new/contracts
        forge script script/DeployMyL1Contracts.s.sol --rpc-url ${{ secrets.ETHEREUM_RPC_URL }} --broadcast --verify
        forge script script/DeployMyL2Contracts.s.sol --rpc-url ${{ secrets.ETHEREUM_RPC_URL }} --broadcast --verify
      env:
        PRIVATE_KEY: ${{ secrets.DEPLOYER_PRIVATE_KEY }}
        ETHERSCAN_API_KEY: ${{ secrets.ETHERSCAN_API_KEY }}
